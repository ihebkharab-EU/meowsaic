<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meowsaic</title>
<meta name="description" content="Meowsaic: send the cats round the loop and clear the mosaic.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meowsaic">
<meta name="theme-color" content="#E8EDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
/* base rules for running as a stand-alone home-screen app */
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: game stage on the left as the one loud element, quiet rules column on the right; stacks on phones. */
:root{
  --bg:#E8EDF2; --panel:#F7F9FB; --ink:#18212D; --muted:#566475; --line:#C3CDD8;
  --board:#D3DCE5; --track:#AEBBC9; --accent:#1F6FEB; --accent-ink:#FFFFFF; --warn:#B4380F; --heart:#D93A40; --coin:#F4C430;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151D; --panel:#18212C; --ink:#E8EEF5; --muted:#93A1B2; --line:#2A3644;
    --board:#1A2430; --track:#33414F; --accent:#6AA7FF; --accent-ink:#0B1118; --warn:#FF9B73; --heart:#FF7A80; --coin:#F4C430;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151D; --panel:#18212C; --ink:#E8EEF5; --muted:#93A1B2; --line:#2A3644;
  --board:#1A2430; --track:#33414F; --accent:#6AA7FF; --accent-ink:#0B1118; --warn:#FF9B73; --heart:#FF7A80; --coin:#F4C430;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:472px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
.game{display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:600;font-size:1.75rem;line-height:1.1;margin:0;letter-spacing:.01em}
.level{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:500}
.level span{min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;font-family:var(--display);font-weight:500;line-height:1.2}
button:hover{border-color:var(--accent)}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:10px 0 0 10px;margin-left:0}
.seg button:last-child{border-radius:0 10px 10px 0}
.icon{padding:5px 10px}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
#cv{display:block;width:100%;aspect-ratio:400/604;max-width:100%;touch-action:manipulation;cursor:pointer}
.menu{display:grid;gap:12px;justify-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px 12px}
.tag{margin:0;color:var(--muted);text-align:center}
.big{width:100%;max-width:300px;padding:12px 16px;font-size:1.125rem;display:grid;gap:2px;justify-items:center;border-radius:14px}
.big small{font-family:var(--body);font-size:.8125rem;font-weight:400;opacity:.9}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:300px;flex-wrap:wrap}
.opt>span,.opt>label{color:var(--muted)}
select{font:inherit;font-family:var(--display);font-weight:500;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.link{background:none;border-color:transparent;text-decoration:underline;color:var(--muted)}
#levels{display:grid;gap:12px}
.lvhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lvhead h2{font-family:var(--display);font-weight:600;margin:0;font-size:1.25rem}
.lvhead span{color:var(--muted);font-size:.875rem;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.lv{display:grid;gap:4px;justify-items:center;padding:8px 4px 6px;position:relative;font-family:var(--body);font-size:.75rem;font-weight:400;line-height:1.25;min-width:0}
.lv canvas{width:64px;height:64px;display:block}
.lv b{font-family:var(--display);font-weight:500;color:var(--muted)}
.lv[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.badge{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.7rem;display:grid;place-items:center;font-weight:700}
#playView{display:flex;flex-direction:column;gap:12px}
.hud{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-family:var(--display);font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.pill small{color:var(--muted);font-family:var(--body);font-size:.75rem}
.pill svg{color:var(--heart);display:block}
.coin{width:14px;height:14px;border-radius:50%;background:var(--coin);border:1.5px solid var(--ink);display:inline-block;flex:none}
.cost::after{content:"";display:inline-block;width:.72em;height:.72em;border-radius:50%;background:var(--coin);border:1.5px solid currentColor;margin-left:5px;vertical-align:-.04em}
.coach{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px}
.coach p{margin:0;min-width:0}
.coach button{flex:none}
.lv.locked canvas{opacity:.2}
#menu{display:grid;gap:12px}
.roadstage{position:relative}
#road{display:block;width:100%;aspect-ratio:4/5;touch-action:none;cursor:grab}
.roadstage #play{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(300px,calc(100% - 32px))}
.chip{position:absolute;top:10px;left:10px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-family:var(--display);font-weight:500;font-size:.875rem;font-variant-numeric:tabular-nums;line-height:1.3}
#here{left:auto;right:10px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:6px 14px}
.lock{position:absolute;left:0;right:0;top:26px;display:grid;place-items:center;color:var(--muted)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 78%,transparent);padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:300px;text-align:center;display:grid;gap:12px}
.card h2{font-family:var(--display);font-weight:600;font-size:1.4rem;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted)}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:5px 14px;font-size:.875rem;max-width:calc(100% - 24px);text-align:center}
.status{margin:0;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9375rem}
.tip{margin:0;color:var(--muted);text-align:center;font-size:.9375rem}
.how{width:100%;max-width:300px}
.how summary{cursor:pointer;font-family:var(--display);font-weight:500;padding:8px 0;color:var(--ink)}
.how summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.how ul{margin:4px 0 8px;padding-left:1.1em;display:grid;gap:6px}
.hap{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--panel)}
</style>
</head>
<body>
<main class="wrap">
  <section class="game">
    <div class="head">
      <h1>Meowsaic</h1>
      <div class="hud">
        <span class="pill" data-i18n-aria="livesAria" aria-label="Lives"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><b id="lives">5</b></span>
        <span class="pill" data-i18n-aria="coinsAria" aria-label="Coins"><i class="coin"></i><b id="coins">20</b></span>
      </div>
    </div>
    <div class="level" id="lvlnav" hidden>
      <button id="menuBtn" data-i18n="menu">Menu</button>
      <button class="icon" id="prev" data-i18n-aria="prevLevel" aria-label="Previous chapter">&#8249;</button>
      <span id="lvl">Chapter 1</span>
      <button class="icon" id="next" data-i18n-aria="nextLevel" aria-label="Next chapter">&#8250;</button>
    </div>

    <div id="menu">
      <div class="stage roadstage">
        <canvas id="road" data-i18n-aria="journey" aria-label="Journey"></canvas>
        <span class="chip" id="prog"></span>
        <button class="chip" id="here" hidden></button>
        <button class="primary big" id="play"><span data-i18n="play">Play</span><small id="playSub"></small></button>
      </div>
      <p class="tip" data-i18n="roadTip"></p>
      <div class="menu">
        <div class="opt">
          <span data-i18n="sound">Sound</span>
          <button id="snd" aria-pressed="true">On</button>
        </div>
        <div class="opt">
          <label for="lang" data-i18n="language">Language</label>
          <select id="lang">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="fr">Fran&ccedil;ais</option>
            <option value="es">Espa&ntilde;ol</option>
          </select>
        </div>
        <div class="opt">
          <span data-i18n="vibration">Vibration</span>
          <button id="vib" aria-pressed="true">On</button>
        </div>
        <details class="how" id="notes">
          <summary data-i18n="how">How to play</summary>
          <ul>
            <li data-i18n="how1"></li>
            <li data-i18n="how2"></li>
            <li data-i18n="how3"></li>
            <li data-i18n="how4"></li>
            <li data-i18n="how5"></li>
            <li data-i18n="how6"></li>
            <li data-i18n="how7"></li>
          </ul>
        </details>
      </div>
      <label class="hap" aria-hidden="true"><input type="checkbox" switch id="hapSw" tabindex="-1"></label>
    </div>

    <div id="playView" hidden>
      <div class="bar">
        <div class="seg" role="group" aria-label="Speed">
          <button id="sp1" aria-pressed="true">1&times;</button>
          <button id="sp2" aria-pressed="false">2&times;</button>
          <button id="sp3" aria-pressed="false">3&times;</button>
        </div>
        <button id="auto" aria-pressed="true" data-i18n="auto">Auto-loop</button>
        <button id="undo" data-i18n="undo">Undo</button>
        <button id="hint" class="cost">Hint</button>
        <button id="restart" data-i18n="restart">Restart</button>
        <button class="cost" id="buy" hidden></button>
      </div>
      <div class="coach" id="coach" hidden><p id="coachT"></p><button id="coachSkip">Skip</button></div>
      <div class="stage">
        <canvas id="cv" data-i18n-aria="boardAria" aria-label="Game board"></canvas>
        <div class="toast" id="toast" hidden></div>
        <div class="overlay" id="overlay" hidden>
          <div class="card">
            <h2 id="ovT"></h2>
            <p id="ovP"></p>
            <div class="row"><button class="primary" id="ovA"></button><button id="ovB"></button><button id="ovC" data-i18n="menu">Menu</button></div>
          </div>
        </div>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
  </section>

</main>
